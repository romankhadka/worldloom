name: Provider Contract

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-contract
  cancel-in-progress: true

jobs:
  smoke:
    name: Public provider contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: 1.20.2
          otp-version: 29.0.4
      - name: Restore Mix and Hex cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
            ~/.hex
          key: provider-contract-${{ runner.os }}-otp-29.0.4-elixir-1.20.2-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix worldloom.providers.smoke
