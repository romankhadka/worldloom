name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  elixir:
    name: Elixir
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: 1.20.2
          otp-version: 29.0.4
      - name: Restore Mix and Hex cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
            ~/.hex
          key: mix-${{ runner.os }}-otp-29.0.4-elixir-1.20.2-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix precommit

  assets:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: 1.20.2
          otp-version: 29.0.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Restore Mix and Hex cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
            ~/.hex
          key: mix-${{ runner.os }}-otp-29.0.4-elixir-1.20.2-${{ hashFiles('mix.lock') }}
      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: mix deps.get
      - name: Verify deterministic scene harness
        run: env MIX_BUILD_PATH=_build/e2e MIX_ENV=test WORLDLOOM_E2E=true WORLDLOOM_FEEDS_ENABLED=false mix test test/worldloom_web/e2e_controller_test.exs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build production image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} .

  deploy:
    name: Deploy production
    needs: [elixir, assets, e2e, container]
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      vars.FLY_APP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy verified revision
        run: flyctl deploy --remote-only --app "$FLY_APP_NAME" --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
